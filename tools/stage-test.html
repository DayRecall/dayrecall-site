<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stage test</title>
<link rel="stylesheet" href="/assets/site.css?v=7ce6d799">
<style>
  body { background: #d8dade; padding: 16px; font: 12px/1.3 monospace; }
  .sheet { display: grid; grid-template-columns: repeat(var(--cols, 2), 342px); gap: 18px 14px; }
  .cell .stage { width: 342px; max-width: 342px; }
  .cell p { margin: 4px 0 0; color: #333; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
  var q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--cols', q.get('cols') || '2');
  var lang = q.get('lang') || 'en';
  document.documentElement.lang = lang === 'zh-Hans' ? 'zh-Hans' : lang;
  fetch('/i18n/strings/' + lang + '.json').then(function (r) { return r.json(); }).then(function (s) {
    var node = document.createElement('script');
    node.type = 'application/json';
    node.id = 'stage-words';
    node.textContent = JSON.stringify(s.stage);
    document.head.appendChild(node);
    var sc = document.createElement('script');
    sc.src = '/assets/stages.js?' + Date.now();
    sc.onload = function () { window.DayRecallStages.ready.then(run); };
    document.head.appendChild(sc);
  });
  function run() {
    var name = q.get('name');
    var theme = q.get('theme') || 'light';
    var times = (q.get('times') || '').split(',').filter(Boolean).map(parseFloat);
    var count = parseInt(q.get('n') || '12', 10);
    var first = true;
    var sheet = document.getElementById('sheet');
    var made = window.DayRecallStages.create(document.createElement('div'), name);
    if (!made) { sheet.textContent = 'no stage ' + name; return; }
    var def = made.def;
    if (!times.length) {
      for (var i = 0; i < count; i++) times.push(+(def.length * (i + 0.5) / count).toFixed(2));
    }
    times.forEach(function (t) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var host = document.createElement('div');
      host.className = 'stage ' + (theme === 'dark' ? 't-dark' : 't-light');
      cell.appendChild(host);
      var label = document.createElement('p');
      label.textContent = name + ' t=' + t;
      cell.appendChild(label);
      sheet.appendChild(cell);
      var m = window.DayRecallStages.create(host, name);
      m.render(t);
    });
    document.title = 'done ' + times.length;
  }
</script>
</body>
</html>
